# Builds the site into an nginx image (ghcr.io/notjustanna/notjustanna-dot-net, arm64 for summernights),
# pins it in the IaC repo (iac-sync on the host restarts the pod), waits for the origin to serve it, then purges Fastly.
# Secrets: IAC_PUSH_TOKEN (fine-grained PAT, NotJustAnna/iac, Contents: read and write), FASTLY_API_TOKEN.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/notjustanna/notjustanna-dot-net
  QUADLET: summernights/podman/quadlet/notjustanna-dot-net.yaml

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SITE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the image in the IaC repo
        env:
          TOKEN: ${{ secrets.IAC_PUSH_TOKEN }}
          TAG: sha-${{ github.sha }}
        run: |
          TAG=${TAG:0:11}  # metadata-action's type=sha is sha-<7 chars>
          git clone -q --depth 1 "https://x-access-token:$TOKEN@github.com/NotJustAnna/iac.git" iac
          cd iac
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          grep -q "image: $IMAGE:" "$QUADLET" || { echo "no $IMAGE image line in $QUADLET" >&2; exit 1; }
          sed -i -E "s|image: $IMAGE:[^[:space:]]+|image: $IMAGE:$TAG|" "$QUADLET"
          git diff --quiet && { echo "already at $TAG"; exit 0; }
          git commit -qam "notjustanna-dot-net: bump to $TAG"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1

      # iac-sync runs every ~2 min; the restart pulls the new image.
      - name: Wait for the origin to serve this build
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS --max-time 10 --connect-to notjustanna.net:443:summernights.at.notjustanna.net:443 \
              https://notjustanna.net/version.txt || true)
            [ "$v" = "$GITHUB_SHA" ] && exit 0
            echo "origin serves '${v:-nothing}', waiting"; sleep 15
          done
          echo "origin never served $GITHUB_SHA" >&2; exit 1

      - name: Purge Fastly
        env:
          FASTLY_SERVICE_ID: FfTtesTkCKpFDfBTk5jJo7
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
        run: |
          curl -sf -X POST "https://api.fastly.com/service/$FASTLY_SERVICE_ID/purge_all" \
            -H "Fastly-Key: $FASTLY_API_TOKEN" \
            -H "Accept: application/json"

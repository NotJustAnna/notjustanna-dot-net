server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind Traefik and Fastly: /post/x -> Location: /post/x/, not http://<pod>:80/post/x/
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Content-hashed by Astro.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
